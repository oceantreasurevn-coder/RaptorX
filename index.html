        /* Noise Texture Overlay */

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease;
        }
        .custom-cursor.hovered {
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.2);
            border-color: transparent;
        }

        /* Glitch Effect */
        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }
        .glitch {
            position: relative;
            color: white;
            mix-blend-mode: hard-light;
        }
        .glitch:before,
        .glitch:after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: black;
            clip: rect(0, 0, 0, 0);
        }
        .glitch:before {
            left: 2px;
            text-shadow: -1px 0 #00ffff;
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch:after {
            left: -2px;
            text-shadow: 2px 0 #ff00ff;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 15px, 0); }
            20% { clip: rect(60px, 9999px, 70px, 0); }
            40% { clip: rect(10px, 9999px, 50px, 0); }
            60% { clip: rect(80px, 9999px, 5px, 0); }
            80% { clip: rect(30px, 9999px, 40px, 0); }
            100% { clip: rect(50px, 9999px, 90px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(10px, 9999px, 90px, 0); }
            20% { clip: rect(30px, 9999px, 10px, 0); }
            40% { clip: rect(50px, 9999px, 30px, 0); }
            60% { clip: rect(10px, 9999px, 70px, 0); }
            80% { clip: rect(80px, 9999px, 20px, 0); }
            100% { clip: rect(60px, 9999px, 50px, 0); }

                    cursor.style.top = `${e.clientY}px`;
                };
                
                const handleMouseOver = (e) => {
                    if (e.target.closest('button, a, input, .cursor-pointer')) {
                        cursor.classList.add('hovered');
                    } else {
                        cursor.classList.remove('hovered');
                    }
                };

                window.addEventListener('mousemove', moveCursor);
                window.addEventListener('mouseover', handleMouseOver);

                return () => {
                    window.removeEventListener('mousemove', moveCursor);
                    window.removeEventListener('mouseover', handleMouseOver);
                };
            }, []);

                        })}
                    </div>
                    </div>
                    </div>
                </div>

                </div>
            );
        };

        const RevealOnScroll = ({ children, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                        observer.unobserve(entry.target);
                    }
                }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => { if (ref.current) observer.unobserve(ref.current); }
            }, []);

            return (
                <div ref={ref} className={`transition-all duration-1000 ease-out transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'} ${className}`}>
                    {children}
                </div>
            );
        };

        const RobotAvatar = ({ size = 56, eyeOffset, wrapperRef, expression = "cute", className = "" }) => (
            <div
                ref={wrapperRef}
                className={`chat-robot-3d chat-expression-${expression} ${className}`}
                style={{
                    "--robot-size": `${size}px`,
                    "--eye-x": `${eyeOffset?.x || 0}px`,
                    "--eye-y": `${eyeOffset?.y || 0}px`
                }}
            >
                <div className="chat-robot-tilt">
                    <div className="chat-robot-head">
                        <div className="chat-robot-face">
                            <div className="chat-robot-screen">
                                <span className="chat-robot-eye"></span>
                                <span className="chat-robot-eye"></span>
                            </div>
                        </div>
                    </div>
                    <span className="chat-robot-band"></span>
                    <span className="chat-robot-ear left"></span>
                    <span className="chat-robot-ear right"></span>
                    <span className="chat-robot-neck"></span>
                    <span className="chat-robot-body"></span>
                    <span className="chat-robot-legs">
                        <span className="chat-robot-leg"></span>
                        <span className="chat-robot-leg"></span>
                    </span>
                    <span className="chat-robot-board">
                        <span className="chat-robot-wheels">
                            <span className="chat-robot-wheel"></span>
                            <span className="chat-robot-wheel"></span>
                        </span>
                    </span>
                </div>
            </div>
        );

        const ChatbotWidget = ({ lang }) => {
            const t = translations[lang];
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([{ role: "assistant", content: t.chat.greeting }]);
            const [input, setInput] = useState("");
            const [isSending, setIsSending] = useState(false);
            const [cursorShift, setCursorShift] = useState({ x: 0, y: 0 });
            const [eyeOffset, setEyeOffset] = useState({ x: 0, y: 0 });
            const [robotMood, setRobotMood] = useState("cute");
            const [isCursorNear, setIsCursorNear] = useState(false);
            const [chatStatus, setChatStatus] = useState({ state: "unknown", message: "" });
            const [showOfflineBanner, setShowOfflineBanner] = useState(false);
            const messagesRef = useRef(null);
            const inputRef = useRef(null);
            const robotRef = useRef(null);
            const headerRobotRef = useRef(null);
            const localizeValue = (value) => {
                if (typeof value === "string") return value;
                return value?.[lang] || value?.en || "";
            };
            const getPageText = () => {
                if (typeof document === "undefined") return "";
                const root = document.querySelector("#root");
                const text = root?.innerText || document.body?.innerText || "";
                return text.replace(/\s+/g, " ").trim();
            };

            const getPageImages = () => {
                if (typeof document === "undefined") return [];
                const origin = window.location.origin;
                return Array.from(document.querySelectorAll("img"))
                    .map((img) => {
                        const src = img.currentSrc || img.getAttribute("src") || "";
                        if (!src || src.startsWith("data:")) return null;
                        let url = src;
                        try {
                            url = new URL(src, origin).toString();
                        } catch (error) {
                            url = src;
                        }
                        return { alt: (img.getAttribute("alt") || "").trim(), src: url };
                    })
                    .filter(Boolean);
            };

            const buildSiteContext = () => {
                const productSummary = products
                    .map((item) => `${item.name} — ${localizeValue(item.sub)} (${localizeValue(item.badge)})`)
                    .join("; ");
                const productImages = products
                    .map((item) => {
                        const sub = localizeValue(item.sub);
                        const badge = localizeValue(item.badge);
                        const tags = ["deck", sub, badge].filter(Boolean).join(" | ");
                        return `${item.name} (${sub}): ${item.image} [tags: ${tags}]`;
                    })
                    .join("\n");
                const gearSummary = gear
                    .map((item) => `${localizeValue(item.name)}: ${localizeValue(item.sub)} — ${item.price}. ${localizeValue(item.description)}`)
                    .join("; ");
                const gearImages = gear
                    .map((item) => `${localizeValue(item.name)}: ${item.image}`)
                    .join("\n");
                const scheduleSummary = t.schedule
                    .map((day) => `${day.date}: ${day.events.map((event) => `${event.time} ${event.title}`).join(", ")}`)
                    .join(" | ");
                const pageText = getPageText();
                const images = getPageImages()
                    .map((image) => `${image.alt || "Image"} — ${image.src}`)
                    .join("\n");
                return [
                    "PAGE TEXT:",
                    pageText || "No page text available.",
                    "IMAGES:",
                    images || "No images available.",
                    "PRODUCT IMAGE MAP:",
                    productImages || "No product images available.",
                    "GEAR IMAGE MAP:",
                    gearImages || "No gear images available.",
                    "STRUCTURED DATA:",
                    "Brand: RAPTOR [X]",
                    `Collection products: ${productSummary}`,
                    `Gear catalog: ${gearSummary}`,
                    `Event timeline: ${scheduleSummary}`
                ].join("\n");
            };
            const apiBase = useMemo(() => {
                if (typeof window === "undefined") return "";
                const metaBase = document.querySelector('meta[name="raptor-api-base"]')?.getAttribute("content");
                if (metaBase && metaBase.trim()) return metaBase.trim();
                const origin = window.location.origin;
                if (origin === "null") return "http://localhost:8787";
                const hostname = window.location.hostname;
                if (hostname === "localhost" || hostname === "127.0.0.1") return origin;
                return `https://api.${hostname}`;
            }, []);
            const chatApiUrl = apiBase ? `${apiBase}/api/chat` : "/api/chat";
            const healthApiUrl = apiBase ? `${apiBase}/api/health` : "/api/health";

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const fetchWithTimeout = async (url, options, timeoutMs = 8000) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    return await fetch(url, { ...options, signal: controller.signal });
                } catch (error) {
                    const message = (error?.message || "").toLowerCase();
                    if (error?.name === "AbortError" || message.includes("aborted") || message.includes("timeout")) {
                        throw new Error("Request timed out. Please try again.");
                    }
                    throw error;
                } finally {
                    clearTimeout(timeoutId);
                }
            };
            const checkHealth = async () => {
                try {
                    const response = await fetchWithTimeout(healthApiUrl, { method: "GET" }, 4000);
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(data.error || "Health check failed.");
                    }
                    return data;
                } catch (error) {
                    return null;
                }
            };
            const updateStatusFromHealth = (health) => {
                if (health && health.status === "ok") {
                    setChatStatus({ state: "online", message: "" });
                    setShowOfflineBanner(false);
                    return;
                }
                if (health && health.status === "error") {
                    setChatStatus({ state: "offline", message: health.message || t.chat.error });
                    return;
                }
                setChatStatus({ state: "offline", message: t.chat.error });
            };
            const refreshStatus = async () => {
                const health = await checkHealth();
                updateStatusFromHealth(health);
                return health;
            };
            const fetchWithRetry = async (url, options, attempts = 3) => {
                let lastError = null;
                for (let attempt = 0; attempt < attempts; attempt += 1) {
                    try {
                        const response = await fetchWithTimeout(url, options, 10000);
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            throw new Error(data.error || "Chat request failed.");
                        }
                        return data;
                    } catch (error) {
                        lastError = error;
                        const message = (error?.message || "").toLowerCase();
                        if (message.includes("timed out") || message.includes("aborted")) {
                            break;
                        }
                        if (attempt < attempts - 1) {
                            await sleep(500 * Math.pow(2, attempt));
                        }
                    }
                }
                throw lastError || new Error(t.chat.error);
            };

            useEffect(() => {
                if (isOpen && inputRef.current) {
                    inputRef.current.focus();
                }
            }, [isOpen]);

            useEffect(() => {
                if (messagesRef.current) {
                    messagesRef.current.scrollTop = messagesRef.current.scrollHeight;
                }
            }, [messages, isSending, isOpen]);

            useEffect(() => {
                let animationFrame = null;
                const handleMove = (event) => {
                    if (animationFrame) cancelAnimationFrame(animationFrame);
                    animationFrame = requestAnimationFrame(() => {
                        const offsetX = (event.clientX / window.innerWidth - 0.5) * 24;
                        const offsetY = (event.clientY / window.innerHeight - 0.5) * 24;
                        setCursorShift({ x: offsetX, y: offsetY });

                        const candidates = [robotRef.current, headerRobotRef.current].filter(Boolean);
                        if (!candidates.length) {
                            setIsCursorNear(false);
                            return;
                        }
                        let closest = null;
                        let minDistance = Infinity;
                        candidates.forEach((node) => {
                            const rect = node.getBoundingClientRect();
                            const centerX = rect.left + rect.width / 2;
                            const centerY = rect.top + rect.height / 2;
                            const dx = event.clientX - centerX;
                            const dy = event.clientY - centerY;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < minDistance) {
                                minDistance = distance;
                                closest = { dx, dy };
                            }
                        });

                        if (!closest) return;
                        const maxDistance = 220;
                        const influence = Math.max(0, Math.min(1, (maxDistance - minDistance) / maxDistance));
                        const clamp = (value) => Math.max(-6, Math.min(6, value * 0.06));
                        setEyeOffset({
                            x: clamp(closest.dx) * influence,
                            y: clamp(closest.dy) * influence
                        });
                        setIsCursorNear(minDistance < 140);
                    });
                };
                window.addEventListener("mousemove", handleMove);
                return () => {
                    window.removeEventListener("mousemove", handleMove);
                    if (animationFrame) cancelAnimationFrame(animationFrame);
                };
            }, []);

            useEffect(() => {
                setMessages((prev) => {
                    if (prev.length === 1 && prev[0].role === "assistant") {
                        return [{ ...prev[0], content: t.chat.greeting }];
                    }
                    return prev;
                });
            }, [lang]);

            useEffect(() => {
                let intervalId = null;
                refreshStatus();
                intervalId = setInterval(refreshStatus, 20000);
                return () => {
                    if (intervalId) clearInterval(intervalId);
                };
            }, [lang]);

            const getExpressionFromReply = (text) => {
                const content = text.toLowerCase();
                const happyTokens = [
                    "stoked", "awesome", "great", "glad", "love", "sick", "fire", "dope", "perfect",
                    "fantastic", "excellent", "nice", "cool", "lets go", "let's go", "rad", "amazing",
                    "super", "genial", "génial", "incroyable", "parfait", "top",
                    "tuyet", "tuyệt", "tuyet voi", "tuyệt vời", "vui", "hay", "dep", "đẹp"
                ];
                const sadTokens = [
                    "sorry", "unfortunately", "can't", "cannot", "cant", "error", "offline", "issue",
                    "problem", "fail", "not able", "sad", "rất tiếc", "rat tiec", "xin loi", "xin lỗi",
                    "khong", "không", "desole", "désolé", "malheureusement", "probleme", "problème", "impossible"
                ];
                if (sadTokens.some((token) => content.includes(token))) return "sad";
                if (happyTokens.some((token) => content.includes(token))) return "happy";
                return "cute";
            };

            const getChatErrorMessage = (error) => {
                const rawMessage = error?.message || "";
                const normalized = rawMessage.toLowerCase();
                if (normalized.includes("timed out") || normalized.includes("aborted")) return "Request timed out. Please try again.";
                const isNetworkError = normalized.includes("failed to fetch") || normalized.includes("network") || normalized.includes("offline");
                if (isNetworkError || !rawMessage) return t.chat.error;
                return rawMessage;
            };

            const sendMessage = async (text) => {
                const trimmed = text.trim();
                if (!trimmed || isSending) return;

                const userMessage = { role: "user", content: trimmed };
                setMessages((prev) => [...prev, userMessage]);
                setInput("");
                setIsSending(true);
                setRobotMood("cute");

                const history = [...messages, userMessage]
                    .filter((item) => item && typeof item.content === "string")
                    .map((item) => ({ role: item.role, content: item.content }))
                    .slice(-12);

                try {
                    const siteContext = buildSiteContext();
                    const data = await fetchWithRetry(chatApiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ messages: history, lang, siteContext })
                    });
                    if (!data.reply) {
                        throw new Error("Chat response missing.");
                    }
                    setChatStatus({ state: "online", message: "" });
                    setMessages((prev) => [...prev, { role: "assistant", content: data.reply }]);
                    setRobotMood(getExpressionFromReply(data.reply));
                    setShowOfflineBanner(false);
                } catch (error) {
                    const health = await refreshStatus();
                    const errorMessage = health?.status === "error" && health.message
                        ? health.message
                        : getChatErrorMessage(error);
                    setMessages((prev) => [...prev, { role: "assistant", content: errorMessage }]);
                    setRobotMood("sad");
                    setShowOfflineBanner(true);
                } finally {
                    setIsSending(false);
                }
            };

            const handleSubmit = (event) => {
                event.preventDefault();
                sendMessage(input);
            };

            const handleKeyDown = (event) => {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage(input);
                }
            };

            const handleSuggestion = (suggestion) => {
                setInput(suggestion);
                if (inputRef.current) {
                    inputRef.current.focus();
                }
            };

            const activeExpression = isCursorNear ? "happy" : robotMood;

            const renderChatBrand = (text) => {
                if (typeof text !== "string") return text;
                const pattern = /(RAPTOR\s*\[X\]|Raptor\s*\[X\]|Raptor\[X\])/g;
                const isBrandToken = /^(RAPTOR\s*\[X\]|Raptor\s*\[X\]|Raptor\[X\])$/;
                const parts = text.split(pattern);
                return parts.map((part, index) => {
                    if (isBrandToken.test(part)) {
                        return <span key={`brand-${index}`} className="chat-brand">{part}</span>;
                    }
                    return <React.Fragment key={`text-${index}`}>{part}</React.Fragment>;
                });
            };

            const renderChatMessage = (text) => {
                if (typeof text !== "string") return text;
                const lines = text.split(/\n+/).map((line) => line.trim()).filter(Boolean);
                if (lines.length === 0) return null;
                const items = [];
                let listItems = [];
                const imageRegex = /(https?:\/\/[^\s)]+?\.(?:png|jpe?g|webp|gif|svg)|\/event\/[^\s)]+?\.(?:png|jpe?g|webp|gif|svg))/gi;
                const imageLineRegex = /^image:\s*/i;

                const imageLines = lines.filter((line) => imageLineRegex.test(line));
                const contentLines = lines.filter((line) => !imageLineRegex.test(line));

                const renderInline = (content) => {
                    const segments = content.split(/\*\*(.+?)\*\*/g);
                    return segments.map((segment, idx) => {
                        if (idx % 2 === 1) {
                            return <strong key={`b-${idx}`} className="chat-highlight">{renderChatBrand(segment)}</strong>;
                        }
                        return <React.Fragment key={`t-${idx}`}>{renderChatBrand(segment)}</React.Fragment>;
                    });
                };

                const extractImageUrls = (line) => {
                    const matches = line.match(imageRegex);
                    return matches ? Array.from(new Set(matches)) : [];
                };

                const stripImageUrls = (line) => line.replace(imageRegex, "").replace(/\s{2,}/g, " ").trim();

                const getImageLabel = (url) => {
                    const normalizedUrl = (url || "").toLowerCase();
                    const productMatch = products.find((item) => normalizedUrl.includes((item.image || "").toLowerCase()));
                    if (productMatch) {
                        const subLabel = localizeValue(productMatch.sub);
                        return `Raptor[X] ${subLabel}`.trim();
                    }
                    const gearMatch = gear.find((item) => normalizedUrl.includes((item.image || "").toLowerCase()));
                    if (gearMatch) {
                        return `[Gear] ${localizeValue(gearMatch.name)}`.trim();
                    }
                    const raw = (url || "").split("/").pop() || "";
                    const base = decodeURIComponent(raw).replace(/\.[^.]+$/, "");
                    const label = base.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();
                    return label || "Raptor[X]";
                };

                const getImageTag = (url) => {
                    const value = (url || "").toLowerCase();
                    if (value.includes("/event/")) return "Event";
                    if (value.includes("gear/")) return "Gear";
                    if (value.includes("canva.site")) return "Deck";
                    return "Product";
                };

                const renderImages = (urls, keyPrefix) => urls.map((url, idx) => (
                    <div key={`${keyPrefix}-img-${idx}`} className="chat-image-card">
                        <img
                            src={url}
                            alt={getImageLabel(url)}
                            loading="lazy"
                            decoding="async"
                            className="chat-inline-image"
                        />
                        <div className="chat-image-bar">
                            <span className="chat-image-tag">{getImageTag(url)}</span>
                            <span>{getImageLabel(url)}</span>
                        </div>
                    </div>
                ));

                const flushList = () => {
                    if (listItems.length) {
                        items.push(
                            <ul key={`list-${items.length}`}>
                                {listItems.map((item, idx) => {
                                    const urls = extractImageUrls(item);
                                    const textOnly = stripImageUrls(item);
                                    return (
                                        <li key={`li-${items.length}-${idx}`}>
                                            {textOnly ? <span>🛹 {renderInline(textOnly)}</span> : <span>🛹</span>}
                                            {urls.length ? <div>{renderImages(urls, `li-${items.length}-${idx}`)}</div> : null}
                                        </li>
                                    );
                                })}
                            </ul>
                        );
                        listItems = [];
                    }
                };

                imageLines.forEach((line, index) => {
                    const cleaned = line.replace(imageLineRegex, "").trim();
                    const urls = extractImageUrls(cleaned);
                    if (urls.length) {
                        items.push(
                            <div key={`img-top-${index}`}>{renderImages(urls, `top-${index}`)}</div>
                        );
                    }
                });

                contentLines.forEach((line, index) => {
                    const isBullet = /^[-•]\s+/.test(line);
                    const isDivider = /^[-_]{3,}$/.test(line);
                    const isHeading = /^(\d+\.|[A-Z][A-Z\s]+:)/.test(line);
                    if (isBullet) {
                        listItems.push(line.replace(/^[-•]\s+/, ""));
                    } else if (isDivider) {
                        flushList();
                        items.push(<div key={`div-${index}`} className="chat-divider" />);
                    } else if (isHeading) {
                        flushList();
                        items.push(
                            <div key={`h-${index}`} className="chat-heading">🏁 {renderInline(line.replace(/:$/, ""))}</div>
                        );
                    } else {
                        flushList();
                        const urls = extractImageUrls(line);
                        const textOnly = stripImageUrls(line);
                        if (textOnly) {
                            items.push(
                                <p key={`p-${index}`}>{renderInline(textOnly)}</p>
                            );
                        }
                        if (urls.length) {
                            items.push(
                                <div key={`img-${index}`}>{renderImages(urls, `p-${index}`)}</div>
                            );
                        }
                    }
                });
                flushList();
                return items;
            };

            return (
                <div className="fixed bottom-6 right-4 sm:right-6 z-[9997] flex flex-col items-end gap-3">
                    {isOpen && showOfflineBanner && chatStatus.state === "offline" && (
                        <div className="flex items-center gap-3 rounded-full bg-black text-yellow-300 border border-yellow-400 px-4 py-2 shadow-[0_12px_30px_rgba(0,0,0,0.35)]">
                            <span className="text-[10px] uppercase tracking-widest font-bold">{t.chat.statusOffline}</span>
                            <button type="button" onClick={refreshStatus} className="text-[10px] uppercase tracking-widest bg-yellow-400 text-black px-3 py-1 rounded-full font-bold hover:bg-yellow-300 transition">
                                {t.chat.retry}
                            </button>
                        </div>
                    )}
                    <div className={`relative w-[86vw] sm:w-[340px] md:w-[400px] transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0 pointer-events-auto' : 'opacity-0 translate-y-6 pointer-events-none'}`}>
                        <div className="chat-glow"></div>
                        <div className="chat-orbit"></div>
                        <div className="relative rounded-3xl overflow-hidden border border-black/10 bg-white text-black shadow-[0_30px_70px_rgba(0,0,0,0.2)]">
                            <div className="px-4 py-3 border-b border-black/10 flex items-center justify-between bg-gradient-to-r from-yellow-400 via-yellow-200 to-white">
                                <div className="flex items-center gap-3">
                                    <div className="chat-header-robot" style={{ transform: `translate3d(${cursorShift.x * 0.15}px, ${cursorShift.y * 0.15}px, 0)` }}>
                                        <RobotAvatar size={36} eyeOffset={eyeOffset} wrapperRef={headerRobotRef} expression={activeExpression} />
                                    </div>
                                    <div>
                                        <p className="text-xs font-black uppercase tracking-[0.3em] text-black/70">{t.chat.subtitle}</p>
                                        <div className="flex flex-wrap items-baseline gap-2">
                                            <span className="chat-brand">{t.chat.brand}</span>
                                            <span className="text-[11px] sm:text-xs font-bold uppercase tracking-widest text-black">{t.chat.titleSuffix}</span>
                                        </div>
                                    </div>
                                </div>
                                <button type="button" onClick={() => setIsOpen(false)} className="text-black/60 hover:text-black transition">
                                    <X size={18} />
                                </button>
                            </div>
                            <div ref={messagesRef} className="max-h-[420px] sm:max-h-[520px] overflow-y-auto px-4 py-4 space-y-3 bg-[radial-gradient(circle_at_top,_rgba(0,0,0,0.04),_transparent_60%)]">
                                {messages.map((message, index) => (
                                    <div key={`${message.role}-${index}`} className={`flex ${message.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`chat-message max-w-[82%] rounded-2xl px-4 py-3 text-sm leading-relaxed shadow-sm ${message.role === 'user' ? 'bg-yellow-400 text-black' : 'bg-gray-100 text-black border border-black/5'}`}>
                                            {message.role === 'user' ? renderChatBrand(message.content) : renderChatMessage(message.content)}
                                        </div>
                                    </div>
                                ))}
                                {isSending && (
                                    <div className="flex justify-start">
                                        <div className="max-w-[82%] rounded-2xl px-4 py-3 text-sm text-black border border-black/5 bg-gray-100">
                                            {t.chat.thinking}
                                        </div>
                                    </div>
                                )}
                            </div>
                            <div className="px-4 pb-4">
                                <div className="flex flex-wrap gap-2 mb-4">
                                    <span className="w-full text-[10px] uppercase tracking-[0.3em] text-black/60">{t.chat.quickTitle}</span>
                                    {t.chat.suggestions.map((suggestion) => (
                                        <button type="button" key={suggestion} onClick={() => handleSuggestion(suggestion)} className="px-3 py-1 rounded-full border border-black/10 text-[10px] uppercase tracking-widest text-gray-600 hover:border-black hover:text-black transition">
                                            {suggestion}
                                        </button>
                                    ))}
                                </div>
                                <form onSubmit={handleSubmit} className="flex items-end gap-2">
                                    <textarea
                                        ref={inputRef}
                                        value={input}
                                        onChange={(event) => setInput(event.target.value)}
                                        onKeyDown={handleKeyDown}
                                        placeholder={t.chat.placeholder}

                                        <SkateboardIcon size={20} />

                                    </div>
                                    <p className="text-xs max-w-xs leading-relaxed">{t.footer.design} <br/>{t.footer.rights}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-16 text-xs uppercase tracking-widest font-bold footer-links">
                                    <div className="flex flex-col gap-4">
                                        <a href="#products" className="hover:text-white transition">{t.nav.product}</a>
                                        <a href="#gear" className="hover:text-white transition">{t.nav.gear}</a>
                                        <a href="#blog" className="hover:text-white transition">{t.nav.blog}</a>
                                        <a href="#schedule" className="hover:text-white transition">{t.nav.schedule}</a>

                                    <div className="flex flex-col gap-4">

                    </footer>
                    <ChatbotWidget lang={lang} />
                </div>
            );
        };
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }

            static getDerivedStateFromError() {
                return { hasError: true };
            }

            componentDidCatch(error, info) {
                console.error('App render error:', error, info);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-black text-white flex items-center justify-center px-6">
                            <div className="max-w-md text-center">
                                <h1 className="text-3xl font-black font-graffiti uppercase mb-4">Raptor[X]</h1>
                                <p className="text-gray-400 text-sm">The page is temporarily unavailable. Please refresh or try again in a moment.</p>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
