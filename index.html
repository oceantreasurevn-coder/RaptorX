                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            throw new Error(data.error || "Chat request failed.");
                        }
                        return data;
                    } catch (error) {
                        lastError = error;

                        const offsetY = (event.clientY / window.innerHeight - 0.5) * 24;
                        setCursorShift({ x: offsetX, y: offsetY });

                        const candidates = [robotRef.current, headerRobotRef.current].filter(Boolean);
                        if (!candidates.length) {
                            setIsCursorNear(false);
                            return;
                        }
                        let closest = null;
                        let minDistance = Infinity;
                        candidates.forEach((node) => {
                            const rect = node.getBoundingClientRect();
                            const centerX = rect.left + rect.width / 2;
                            const centerY = rect.top + rect.height / 2;
                            const dx = event.clientX - centerX;
                            const dy = event.clientY - centerY;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < minDistance) {
                                minDistance = distance;
                                closest = { dx, dy };
                            }
                        });

                        if (!closest) return;
                        const maxDistance = 220;
                        const influence = Math.max(0, Math.min(1, (maxDistance - minDistance) / maxDistance));
                        const clamp = (value) => Math.max(-6, Math.min(6, value * 0.06));
                        setEyeOffset({
                            x: clamp(closest.dx) * influence,
                            y: clamp(closest.dy) * influence
                        });
                        setIsCursorNear(minDistance < 140);
                    });

                                    </div>
                                    <button type="button" onClick={() => setShowSuccess(false)} className="mt-4 mx-auto flex items-center justify-center px-6 py-2 text-xs font-bold uppercase tracking-[0.3em] text-black bg-yellow-400 rounded-full shadow-[0_12px_30px_rgba(255,214,0,0.35)] hover:bg-yellow-300 transition-colors">
                                        {t.ui.close}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-black text-neutral-500 py-16 border-t border-neutral-900">
                        <div className="container mx-auto px-4 sm:px-6">
                            <div className="flex flex-col md:flex-row justify-between items-start gap-12">
                                <div>
                                    <div className="flex items-center gap-2 mb-4 text-white">
                                        <SkateboardIcon size={20} />
                                        <span className="text-xl font-black uppercase italic font-graffiti">Raptor[X]</span>
                                    </div>
                                    <p className="text-xs max-w-xs leading-relaxed">{t.footer.design} <br/>{t.footer.rights}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-16 text-xs uppercase tracking-widest font-bold">
                                    <div className="flex flex-col gap-4">
                                        <a href="#products" className="hover:text-white transition">{t.nav.product}</a>
                                        <a href="#gear" className="hover:text-white transition">{t.nav.gear}</a>
                                        <a href="#blog" className="hover:text-white transition">{t.nav.blog}</a>
                                        <a href="#schedule" className="hover:text-white transition">{t.nav.schedule}</a>
                                        <a href="#" className="hover:text-white transition">{t.footer.support}</a>
                                    </div>
                                    <div className="flex flex-col gap-4">
                                        <a href="#" className="hover:text-white transition">{t.footer.instagram}</a>
                                        <a href="#" className="hover:text-white transition">{t.footer.twitter}</a>
                                        <a href="#" className="hover:text-white transition">{t.footer.facebook}</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </footer>
                    <ChatbotWidget lang={lang} />
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Force cache clear and load latest version
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'activated') {
                            window.location.reload();
                        }
                    });
                });
            });
        }
        
        // Also clear old caches
        if ('caches' in window) {
            caches.keys().then(cacheNames => {
                cacheNames.forEach(cacheName => {
                    if (cacheName !== 'raptor-v2-floating-hover') {
                        caches.delete(cacheName);
                    }
                });
            });
        }
    </script>
</body>
</html>
