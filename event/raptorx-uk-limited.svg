<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="RAPTOR [X] Limited for UK deck">
  <defs>
    <clipPath id="deck-shape">
      <rect x="40" y="120" width="1120" height="260" rx="130" ry="130" />
    </clipPath>
    <linearGradient id="uk-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8102E"/>
      <stop offset="1" stop-color="#012169"/>
    </linearGradient>
  </defs>
  <rect x="30" y="110" width="1140" height="280" rx="140" ry="140" fill="#050505" stroke="#111" stroke-width="4"/>
  <g clip-path="url(#deck-shape)">
    <rect x="0" y="0" width="1200" height="500" fill="#0a0a0a"/>
    <g transform="rotate(-12 600 250) translate(-150 0)">
      <rect x="0" y="210" width="1600" height="90" fill="#ffffff" opacity="0.95"/>
      <rect x="0" y="235" width="1600" height="40" fill="#C8102E"/>
      <rect x="0" y="120" width="1600" height="70" fill="#012169" opacity="0.9"/>
      <rect x="0" y="320" width="1600" height="70" fill="#012169" opacity="0.9"/>
    </g>
    <g opacity="0.3">
      <circle cx="220" cy="220" r="140" fill="#012169"/>
      <circle cx="980" cy="280" r="160" fill="#C8102E"/>
    </g>
  </g>
  <text x="600" y="245" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="64" fill="url(#uk-glow)" font-weight="800" letter-spacing="6">RAPTOR [X]</text>
  <text x="600" y="295" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" fill="#f5f5f5" letter-spacing="4">LIMITED FOR UK</text>
</svg>
